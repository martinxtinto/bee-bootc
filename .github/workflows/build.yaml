name: Build and push image

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
  schedule:
    # Weekly rebuild to pick up upstream base/image updates (Saturday 03:00 UTC).
    - cron: "0 3 * * 6"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Nix checks
        run: nix flake check -L

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # Ubuntu 24.04 blocks unprivileged user namespaces by default, which makes
      # rootless podman fail with "failed to reexec: Permission denied". The
      # distro podman ships an AppArmor profile granting userns; the nixpkgs podman
      # in the dev shell does not, so relax the restriction for this ephemeral runner.
      - name: Allow rootless podman user namespaces
        run: |
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Build image
        run: nix run .#build

      - name: Tag image
        id: tags
        shell: nix develop -c bash -e {0}
        run: |
          tags=("${IMAGE_NAME}:sha-${GITHUB_SHA::8}")

          if [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            tags+=("${IMAGE_NAME}:latest")
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tags+=("${IMAGE_NAME}:${GITHUB_REF#refs/tags/}")
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            tags+=("${IMAGE_NAME}:$(date -u +%F)")
          fi

          for tag in "${tags[@]}"; do
            podman tag bee-bootc:test "$tag"
          done

          {
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        shell: nix develop -c bash -e {0}
        run: podman login "${REGISTRY}" -u "${{ github.actor }}" --password-stdin <<< "${{ secrets.GITHUB_TOKEN }}"

      - name: Push image
        if: github.event_name != 'pull_request'
        shell: nix develop -c bash -e {0}
        run: |
          while IFS= read -r tag; do
            [[ -n "$tag" ]] && podman push "$tag"
          done <<< "${{ steps.tags.outputs.tags }}"
